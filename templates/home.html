<!DOCTYPE html>
<html lang="en">
<head>

    <title>Agency Portfolio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="layout-flex">
    <nav>
        <div class="nav-logo">
            <img src="/static/logo.png" alt="Agency Logo" />
        </div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/about">About Us</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>
    <style>
    .nav-logo {
        display: inline-block;
        margin-right: 2em;
        vertical-align: middle;
    }
    nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2em;
    }
    nav ul {
        display: flex;
        gap: 2em;
    }
    </style>
    <main class="main-grow">
        <h1>Welcome to Our Agency</h1>
        <section>
            <h2>Our Work & Projects</h2>
            <div class="projects">

                </div>
                <div class="project-card">
                    <h3>Project Beta</h3>
                    <p>Short description of Project Beta.</p>
                </div>
                <div class="project-card">
                    <h3>Project Gamma</h3>
                    <p>Short description of Project Gamma.</p>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        &copy; 2025 Periscope. All rights reserved.
    </footer>
    <style>
    html, body.layout-flex {
        height: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body.layout-flex {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    .main-grow {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    .site-footer {
        background: #1976d2;
        color: #fff;
        text-align: center;
        padding: 1.2em 0 1em 0;
        font-size: 1.05em;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        margin-top: 0;
    }

</html>
